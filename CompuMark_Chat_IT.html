<body>
	<p><b> Messageing In-App For External Site For *** CompuMark IT Language***</b></p>
	<script type='text/javascript'>
		//Passing Web Context to Prechat - BEGIN
		var ChatLanguage = 'IT';
		function initEmbeddedMessaging() {
			try {
				embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
				//sessionStorage.setItem('Chat_Language', ChatLanguage);
				// ✅ Set customData BEFORE init()
				embeddedservice_bootstrap.settings.customData = {
    					Chat_Language: ChatLanguage
				};
				embeddedservice_bootstrap.init(
					'00DPt000006W1ya',
					'MIAW_Embedded_Service_Compumark',
					'https://cpa-global--ipcrmqa.sandbox.my.site.com/ESWMIAWEmbeddedService1750419685161',
					{
						scrt2URL: 'https://cpa-global--ipcrmqa.sandbox.my.salesforce-scrt.com'
					}
				);
			} catch (err) {
				console.error('Error loading Embedded Messaging: ', err);
			}
		};

		// ✅ Fire custom event after Embedded Messaging is ready
		window.addEventListener("onEmbeddedMessagingReady", () => {
		console.log('🎯 Embedded Messaging Ready: dispatching ChatLanguage');
			window.dispatchEvent(new CustomEvent('sendChatLanguage', {
			    detail: { Chat_Language: ChatLanguage }
			}));
		});
		
		//window.addEventListener("onEmbeddedMessagingReady", e => {
		//log event
		//console.log("onEmbeddedMessagingReady event triggered");
		
		//set visible prechat field
		//embeddedservice_bootstrap.prechatAPI.setVisiblePrechatFields({
		//});
		
		//Set invisible prechat field
		//embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
			//"Chat_Language" : ChatLanguage
		//});
		//});
		//Passing Web Context to Prechat - END
	</script>
	<script type='text/javascript' src='https://cpa-global--ipcrmqa.sandbox.my.site.com/ESWMIAWEmbeddedService1750419685161/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
</body>
